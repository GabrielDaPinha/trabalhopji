<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="img/dragao.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="suporte.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-dark sticky-top" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <img src="img/dragao.png" alt="Logo Apiscale" width="30" height="30">
                <span class="brand-text">APISCALE</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto gap-lg-3">
                    <li class="nav-item"><a class="nav-link text-white" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="sobre.html">Sobre</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown">
                            Ferramentas
                        </a>
                        <ul class="dropdown-menu p-2" style="min-width: 15rem; width: max-content;">
                            <div class="row g-0">
                                <div class="col-6">
                                    <li><a class="dropdown-item" href="#"><i class="bi bi-columns-gap me-2"></i>Dashboard</a>
                                    </li>
                                    <li><a class="dropdown-item" href="#"><i class="bi bi-card-checklist me-2"></i>Tarefas</a>
                                    </li>
                                    <li><a class="dropdown-item" href="#"><i class="bi bi-people me-2"></i>Meus Grupos</a></li>
                                </div>
                                <div class="col-6">
                                    <li><a class="dropdown-item" href="#"><i class="bi bi-calendar4 me-2"></i>Calendário</a>
                                    </li>
                                    <li><a class="dropdown-item" href="#"><i class="bi bi-file-earmark-text me-2"></i>Documentos</a>
                                    </li>
                                    <li><a class="dropdown-item" href="suporte.html"><i class="bi bi-headset me-2"></i>Suporte</a>
                                    </li>
                                </div>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Jornadas</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="suporte.html">Suporte</a></li>
                </ul>
                <button type="button" class="btn btn-light fw-bold">Começar Agora</button>
            </div>
        </div>
    </nav>

    <main>

        <main class="container my-5 pt-5">
            <div class="row justify-content-center">
                <div class="col-lg-9 col-md-11">
                    <h3 class="mb-4 fw-semibold text-white">Mensagem Para o Suporte</h3>

                    <form class="row g-3">
                        <div class="col-md-7">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="nome" placeholder="Nome" required>
                                <label for="nome">Nome Completo</label>
                            </div>
                        </div>

                        <div class="col-md-5">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="empresa" placeholder="Empresa">
                                <label for="empresa">Empresa (Opcional)</label>
                            </div>
                        </div>

                        <div class="col-md-12">
                            <div class="form-floating">
                                <input type="email" class="form-control" id="email" placeholder="E-mail" required>
                                <label for="email">E-mail de Contato</label>
                            </div>
                        </div>

                        <div class="col-md-12 py-2">
                            <label class="form-label text-white small d-block">Prioridade do Atendimento:</label>
                            <div class="form-check form-check-inline">
                                <input type="radio" name="prio" id="p1" class="form-check-input" checked>
                                <label for="p1" class="form-check-label text-white-50">Normal</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input type="radio" name="prio" id="p2" class="form-check-input">
                                <label for="p2" class="form-check-label text-white-50">Urgente</label>
                            </div>
                            <div class="col-12">
                                <div class="form-floating">
                                    <textarea class="form-control" id="mensagem" placeholder="Sua mensagem"
                                        style="height: 150px" required></textarea>
                                    <label for="mensagem">Sua Mensagem</label>
                                </div>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="form-check">
                                <input type="checkbox" id="termos" class="form-check-input" required>
                                <label for="termos" class="form-check-label text-white small">Aceito os termos de
                                    processamento de dados.</label>
                            </div>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary-custom">Enviar Solicitação</button>
                            <button type="reset" class="btn btn-outline-custom ms-2">Limpar</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <section class="stats-custom py-5 mt-5">
            <div class="container">
                <div class="row text-center align-items-center g-4">
                    <div class="col-6 col-md-3">
                        <i class="fa-brands fa-instagram neon-vazado fa-5x"></i>
                        <h4 class="fw-bold">@apiscale_wevers</h4>
                        <p class="text-secondary">Nosso Instagram</p>
                    </div>
                    <div class="col-6 col-md-3">
                        <i class="fa-solid fa-at neon-vazado fa-5x"></i>
                        <h4 class="fw-bold">E-Mail</h4>
                        <p class="text-secondary">apiscalereal@gmail.com</p>
                    </div>
                    <div class="col-6 col-md-3">
                        <i class="fa-solid fa-phone neon-vazado fa-5x"></i>
                        <h4 class="fw-bold">(19) 99123-6769</h4>
                        <p class="text-secondary">Telefone para Contato</p>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="mx-auto bg-white rounded-circle d-flex align-items-center justify-content-center shadow"
                            style="width: 140px; height: 140px;">
                            <img src="img/dragao.png" alt="Mascote" class="img-fluid p-2">
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
